<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion</title>
  <link rel="stylesheet" href="titlebar.css">
</head>
<body>
  <div id="titlebar">
    <!-- Región Izquierda: Logo, Nombre, Badge y Navegación Historial -->
    <div class="brand-section">
      <img src="../assets/icon.svg" class="app-icon" alt="Notion" />
      <span class="app-name">Notion</span>
      <span id="unread-badge" class="unread-badge">0</span>

      <div class="nav-controls">
        <button class="nav-btn" id="btn-back" title="Atrás (Alt+←)" disabled>
          <svg viewBox="0 0 24 24" width="16" height="16">
            <path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
          </svg>
        </button>
        <button class="nav-btn" id="btn-forward" title="Adelante (Alt+→)" disabled>
          <svg viewBox="0 0 24 24" width="16" height="16">
            <path fill="currentColor" d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Región Central: Zona de arrastre y título dinámico -->
    <div class="drag-region" id="drag-region">
      <span id="window-title" class="window-title"></span>
    </div>

    <!-- Región Derecha: Controles de ventana -->
    <div class="window-controls">
      <button class="ctrl-btn" id="btn-reload" title="Recargar (Ctrl+R)">
        <svg viewBox="0 0 24 24" width="15" height="15">
          <path fill="currentColor" d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        </svg>
      </button>

      <button class="ctrl-btn" id="btn-minimize" title="Minimizar">
        <svg viewBox="0 0 24 24" width="16" height="16">
          <path fill="currentColor" d="M19 13H5v-2h14v2z"/>
        </svg>
      </button>

      <button class="ctrl-btn" id="btn-maximize" title="Maximizar">
        <svg id="icon-max" viewBox="0 0 24 24" width="15" height="15">
          <path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/>
        </svg>
        <svg id="icon-restore" style="display: none;" viewBox="0 0 24 24" width="15" height="15">
          <path fill="currentColor" d="M4 8H2V2h6v2H4v4zm18-6h-6v2h4v4h2V2zM2 22h6v-2H4v-4H2v6zm16-4v4h-4v2h6v-6h-2z"/>
        </svg>
      </button>

      <button class="ctrl-btn close-btn" id="btn-close" title="Cerrar">
        <svg viewBox="0 0 24 24" width="16" height="16">
          <path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
      </button>
    </div>
  </div>

  <script src="titlebar.js"></script>
</body>
</html>
